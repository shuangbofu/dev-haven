name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Tests
        shell: bash
        run: npm test 2>&1 | tee "$RUNNER_TEMP/devhaven-tests.log"
      - name: Summarize failed tests
        if: failure()
        shell: bash
        run: |
          node -e 'const fs=require("fs"),p=require("path").join(process.env.RUNNER_TEMP,"devhaven-tests.log"); if(fs.existsSync(p)){const log=fs.readFileSync(p,"utf8"),failures=log.match(/not ok [\s\S]*?(?=\n# Subtest:|\n1\.\.|$)/g)||[log.slice(-3000)];for(const failure of failures){const message=failure.slice(0,3500).replaceAll("%","%25").replaceAll("\r","%0D").replaceAll("\n","%0A");console.log("::error title=Test failure details::"+message)}}'

      - run: npm run release:source
